<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Teste da Visão de Perto</title>
<style>
:root{
  --navy:#12325B; --green:#18934A; --green2:#12773a;
  --cream:#FBF8F3; --ink:#1f2933; --muted:#5b6670;
  --line:#e6e1d8; --soft:#EEF4FB; --warn:#FFF4D6; --warnline:#E9C46A; --red:#C0392B;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:19px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.top{background:var(--navy);color:#fff;text-align:center;padding:10px 14px;font-size:15px}
header.top b{color:#9fe0b6}
.bar{height:8px;background:#dde3ea}
.bar i{display:block;height:100%;width:0;background:var(--green);transition:width .4s}
main{flex:1;padding:22px 18px 30px}
.screen{animation:fade .35s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tag{display:inline-block;background:var(--soft);color:var(--navy);font-weight:700;font-size:14px;padding:5px 12px;border-radius:99px;margin-bottom:12px;text-transform:uppercase;letter-spacing:.5px}
h1{font-size:29px;line-height:1.2;color:var(--navy);margin-bottom:10px}
h2{font-size:25px;line-height:1.25;color:var(--navy);margin-bottom:8px}
h3{font-size:21px;color:var(--navy);margin:24px 0 10px}
p.sub{color:var(--muted);margin-bottom:16px}
.hero1{max-height:190px;object-fit:cover}
.hero{width:100%;border-radius:18px;display:block;margin:4px 0 14px;box-shadow:0 6px 20px rgba(18,50,91,.12)}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:19px 18px;font-size:21px;font-weight:800;cursor:pointer;text-align:center;text-decoration:none;letter-spacing:.3px;font-family:inherit}
.btn.go{background:var(--green);color:#fff;box-shadow:0 5px 0 var(--green2)}
.btn.go:active{transform:translateY(3px);box-shadow:0 2px 0 var(--green2)}
.opts{display:flex;flex-direction:column;gap:12px;margin-top:16px}
.opts.two{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:#fff;border:2px solid var(--line);border-radius:14px;padding:17px 16px;font-size:20px;color:var(--ink);cursor:pointer;font-family:inherit}
.opts.two .opt{flex-direction:column;text-align:center;padding:20px 10px;gap:6px;font-weight:700}
.opts.two .face{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.opt .em{font-size:40px;width:auto}
.face{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.opt .em{font-size:26px;width:34px;text-align:center;flex:none}
.opt .ck{margin-left:auto;width:26px;height:26px;border-radius:7px;border:2px solid #b9c2cc;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-size:17px}
.opt.sel{border-color:var(--green);background:#ECF8F0}
.opt.sel .ck{background:var(--green);border-color:var(--green)}
.opt.sel .ck:after{content:"✓"}
.rd{width:24px;height:24px;border-radius:50%;border:2px solid #b9c2cc;flex:none}
.opt.sel .rd{border:7px solid var(--green)}
.trust div{font-weight:600}
.hint{font-size:16px;color:var(--muted);margin-top:4px}
.fb{display:none;margin-top:18px;background:#fff;border-left:6px solid var(--green);border-radius:12px;padding:16px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.fb.on{display:block;animation:fade .35s ease}
.fb .who{font-size:14px;font-weight:800;color:var(--green);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.fb .btn{margin-top:14px}
.back{background:none;border:0;color:var(--muted);font-size:16px;margin-bottom:10px;cursor:pointer;padding:4px 0;font-family:inherit}
.card{background:#fff;border-radius:18px;padding:22px 18px;box-shadow:0 6px 20px rgba(18,50,91,.08)}
.center{text-align:center}
.big{font-size:46px;margin-bottom:6px}
.card p{margin-bottom:12px}
.strip{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:14px 0}
.strip img{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;display:block}
.cap{font-size:14px;color:var(--muted);text-align:center;margin:-6px 0 14px}
.spin{width:64px;height:64px;border-radius:50%;border:7px solid #dde3ea;border-top-color:var(--green);margin:16px auto 22px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.steps{list-style:none;text-align:left;max-width:360px;margin:0 auto}
.steps li{padding:9px 0;color:#9aa4ad;font-size:18px}
.steps li.done{color:var(--ink)}
.steps li.done:before{content:"✓  ";color:var(--green);font-weight:800}
.steps li:not(.done):before{content:"•  "}
.head{background:var(--navy);color:#fff;border-radius:18px;padding:20px 18px;margin-bottom:16px}
.head .tag{background:rgba(255,255,255,.15);color:#fff}
.head h2,.head h1{color:#fff}
.meter{margin:14px 0 4px;height:16px;border-radius:99px;background:linear-gradient(90deg,#7cd39b,#f2c94c,#eb7a52);position:relative}
.meter b{position:absolute;top:-6px;width:28px;height:28px;border-radius:50%;background:#fff;border:5px solid var(--navy);transform:translateX(-50%);transition:left 1.2s}
.meter-l{display:flex;justify-content:space-between;font-size:14px;opacity:.85}
.vsl{position:relative;max-width:380px;margin:0 auto 18px;border-radius:18px;overflow:hidden;background:#000;box-shadow:0 8px 24px rgba(0,0,0,.18)}
.vsl video{width:100%;aspect-ratio:9/16;display:block;object-fit:cover}
.snd{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);background:rgba(0,0,0,.7);color:#fff;border:0;border-radius:99px;padding:10px 18px;font-size:17px;font-weight:700;font-family:inherit;cursor:pointer}
.ab{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.ab>div{border-radius:16px;padding:14px 12px;font-size:16px}
.ab .a{background:#FDECEA;border:2px solid #f3b8b0}
.ab .b{background:#E6F6EC;border:2px solid #9fd8b3}
.ab h4{font-size:17px;margin-bottom:8px}
.ab ul{list-style:none}
.ab li{padding:4px 0}
.box{background:#fff;border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 4px 16px rgba(0,0,0,.05)}
.box h3{margin-top:0}
.box ul{list-style:none}
.box li{padding:8px 0 8px 32px;position:relative;border-bottom:1px dashed var(--line)}
.box li:last-child{border-bottom:0}
.box li:before{content:"•";position:absolute;left:10px;color:var(--navy);font-weight:800}
.box.ok li:before{content:"✓";color:var(--green);left:6px}
.warn{background:var(--warn);border:2px solid var(--warnline);border-radius:14px;padding:14px 16px;margin-bottom:14px;font-size:18px}
.grau{background:var(--soft);border-radius:14px;padding:14px 16px;margin-bottom:14px;font-size:18px}
.grau b{font-size:24px;color:var(--navy)}
.how{counter-reset:s;list-style:none}
.how li{counter-increment:s;padding:10px 0 10px 50px;position:relative;font-size:18px}
.how li:before{content:counter(s);position:absolute;left:0;top:8px;width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center}
.models{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 6px}
.model{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;cursor:pointer;font-weight:700;font-size:18px}
.model img{width:100%;border-radius:8px;margin-bottom:6px;display:block}
.model.sel{border-color:var(--green);background:#ECF8F0}
.offer{position:relative;background:#fff;border:2px solid var(--line);border-radius:16px;padding:18px 16px;margin-bottom:12px;cursor:pointer}
.offer.sel{border-color:var(--green);background:#ECF8F0;box-shadow:0 0 0 3px rgba(24,147,74,.15)}
.offer .rib{position:absolute;top:-13px;right:14px;background:#E8562A;color:#fff;font-size:13px;font-weight:800;padding:4px 10px;border-radius:99px}
.offer .t{font-size:21px;font-weight:800;color:var(--navy)}
.offer .d{font-size:16px;color:var(--muted);margin:2px 0 8px}
.offer .p{font-size:30px;font-weight:900;color:var(--green2)}
.offer .p s{font-size:17px;color:#98a2ab;font-weight:600;margin-right:6px}
.offer .u{font-size:15px;color:var(--muted)}
.trust{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0}
.trust div{background:#fff;border-radius:12px;padding:10px;font-size:15px;text-align:center;border:1px solid var(--line)}
.trust div b{display:block;font-size:22px}
details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px}
summary{font-weight:700;cursor:pointer;font-size:18px}
.parc{width:100%;border-collapse:collapse;margin-top:10px;font-size:17px}
.parc td,.parc th{padding:7px 6px;border-bottom:1px solid var(--line);text-align:right}
.parc td:first-child,.parc th:first-child{text-align:left;font-weight:700}
.parc th{font-size:15px;color:var(--muted)}
details p{margin-top:10px;font-size:17px;color:var(--muted)}
form .f{margin-bottom:12px}
form label{display:block;font-weight:700;font-size:17px;margin-bottom:5px}
form input{width:100%;font-size:19px;padding:15px 14px;border:2px solid #cfd6de;border-radius:12px;background:#fff;font-family:inherit}
form input:focus{outline:none;border-color:var(--green)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum{background:var(--soft);border-radius:14px;padding:14px 16px;margin-bottom:16px;font-size:18px}
.err{color:var(--red);font-size:16px;margin:-4px 0 10px;display:none}
.pts{margin:12px 0 4px;text-align:left}
.pts div{background:var(--soft);border-left:4px solid var(--navy);border-radius:12px;padding:12px 14px;margin-bottom:8px;font-size:20px;line-height:1.3}
.sol{background:#E6F6EC;border:2px solid #9fd8b3;color:#0f5c2e;border-radius:12px;padding:12px 14px;font-weight:700;font-size:19px;margin:6px 0 12px;text-align:left}
.small{font-size:14px;color:var(--muted);text-align:center;margin-top:10px}
.fix{position:fixed;left:0;right:0;bottom:0;padding:10px 14px 14px;background:linear-gradient(transparent,var(--cream) 25%);z-index:5}
.fix .btn{max-width:492px;margin:0 auto}
.pad{height:96px}
footer{padding:18px 18px 30px;text-align:center;font-size:13px;color:#8a949d;line-height:1.5}
</style>
</head>

const _vistos = {};
function etapa(){
  const s=S[cur]; let nome;

  const num=S.slice(0,cur+1).filter((x,i)=>vis(i)).length;
  const ev=`V2_Etapa_${String(num).padStart(2,"0")}_${nome}`;
  if(_vistos[ev]) return; _vistos[ev]=1;
  try{ if(window.fbq) fbq("trackCustom", ev, {etapa:num, nome}); }catch(e){}
}
function render(){
  setBar();

  if(s.q) return rQ(s);
  ({ins:rIns,loading:rLoad,diag:rDiag,capture:rCap,pitch:rPitch,form:rForm,ok:rOk})[s.type](s);
}

function nivel(){
  let p=(A.momentos||[]).length*1.5 + doeu().length*1.5;
  p+={perto:1.5,telas:1.5,ambos:3}[A.dificuldade]||0;
  p+={"40a49":1,"50a59":1.5,"60a69":2,"70":2}[A.idade]||0;
  p+={nao:1,farmacia:1,baixo:.5}[A.usa]||0;
  const pct=Math.max(15,Math.min(92,Math.round(p/15*100)));
  return {pct,nome:pct>=60?"Alto":pct>=33?"Moderado":"Leve"};
}

function datasEntrega(){

  while(out.length<3){ d.setDate(d.getDate()+1); if(d.getDay()===0) continue; out.push(`${dias[d.getDay()]} ${String(d.getDate()).padStart(2,"0")}/${mes[d.getMonth()]}`); }
  return out;
}

      <div class="f"><label>Complemento / ponto de referência (opcional)</label><input name="ref" placeholder="Ex: casa azul, ao lado da padaria"></div>
      <div class="f"><label>Escolha o dia da sua entrega</label>
        <div class="models" id="dias" style="grid-template-columns:1fr 1fr 1fr">${datas.map((d,i)=>`<div class="model" data-d="${d}" style="font-size:16px;padding:12px 6px">${d.replace(" ","<br>")}</div>`).join("")}</div>
        <p class="hint" style="font-size:15px">Seu pedido chega <b>no dia que você escolher</b>, das 8h às 18h. A gente te avisa no WhatsApp quando o entregador estiver a caminho.</p></div>
      <p class="err" id="errf">Preencha todos os campos e escolha o dia da entrega.</p>
      <button class="btn go" type="submit">CONFIRMAR AGENDAMENTO</button>
    </form>`);
  const f=document.getElementById("f");
  let dia=null;
  f.querySelectorAll("#dias .model").forEach(m=>m.onclick=()=>{dia=m.dataset.d;f.querySelectorAll("#dias .model").forEach(x=>x.classList.toggle("sel",x===m));});
  f.whats.oninput=maskTel;
  document.getElementById("sn").onchange=e=>{ f.num.value=e.target.checked?"S/N":""; f.num.readOnly=e.target.checked; f.num.style.background=e.target.checked?"#eef1f4":"#fff"; };
  f.cep.oninput=async e=>{
    let d=e.target.value.replace(/\D/g,"").slice(0,8); e.target.value=d.length>5?d.slice(0,5)+"-"+d.slice(5):d;
    if(d.length!==8) return;
    const msg=document.getElementById("cepmsg"); msg.textContent="Buscando endereço…";
    try{ const r=await fetch(`https://viacep.com.br/ws/${d}/json/`); const j=await r.json();
      if(j.erro) throw 0;
      if(j.logradouro) f.rua.value=j.logradouro; if(j.bairro) f.bairro.value=j.bairro; if(j.localidade) f.cidade.value=`${j.localidade} - ${j.uf}`;
      msg.textContent="Endereço encontrado. Confira e coloque o número."; f.num.focus();
    }catch(_){ msg.textContent="Não achamos o CEP automaticamente — preencha o endereço abaixo."; }
  };
  f.onsubmit=e=>{e.preventDefault();
    const v=Object.fromEntries(new FormData(f));
    const ok=["nome","whats","cep","num","rua","bairro","cidade"].every(k=>(v[k]||"").trim()) && v.whats.replace(/\D/g,"").length>=10 && dia;
    if(!ok){document.getElementById("errf").style.display="block";return;}
    st.nome=v.nome; st.whats=v.whats; st.end=v; st.dia=dia;
    const codigo="VL"+Date.now().toString(36).toUpperCase().slice(-6);
    try{ fetch("/api/utmify",{method:"POST",keepalive:true,headers:{"Content-Type":"application/json"},
      body:JSON.stringify({codigo,oferta:st.oferta,nome:v.nome,whats:v.whats,utm:UTM})}).catch(()=>{}); }catch(_){}
    const msg=`Olá! Quero agendar minha entrega.\n\n*Pedido:* ${o.titulo} - R$ ${o.preco}\n*Modelo:* ${st.modelo}\n\n*CEP:* ${v.cep}\n*WhatsApp:* ${v.whats}\n*Nome:* ${v.nome}\n*Endereço:* ${v.rua}\n*Número:* ${v.num}\n*Bairro:* ${v.bairro}\n*Cidade:* ${v.cidade}${v.ref?`\n*Complemento:* ${v.ref}`:""}\n*Dia da entrega:* ${dia}\n*Código:* ${codigo}`;
    st.wa = CONFIG.whatsapp ? `https://wa.me/${CONFIG.whatsapp}?text=${encodeURIComponent(msg)}` : null;
    hook("lead"); hook("pedido",{oferta:o.titulo,preco:o.preco,modelo:st.modelo,dia,endereco:v});
    px("Purchase",{value:+o.preco.replace(",","."),currency:"BRL",faixa_idade:A.idade,sexo:A.sexo});
    next();};
}

function rOk(){
  const o=OFFERS[st.oferta];
  screen(`<div class="center">
    ${st.wa?`<span class="tag">Último passo</span><h2>Falta só enviar o seu pedido, ${nome1()}</h2><p class="sub" style="margin-top:8px">Toque no botão verde abaixo. O WhatsApp vai abrir com o seu pedido já escrito. É só apertar <b>enviar</b>.</p>`
           :`<h2>Entrega agendada, ${nome1()}!</h2><p class="sub" style="margin-top:8px">Em breve vamos chamar você no WhatsApp para confirmar o pedido.</p>`}
    <div class="sum" style="text-align:left">${o.titulo} · modelo ${esc(st.modelo)}<br>Entrega: <b>${esc(st.dia)}</b>, das 8h às 18h<br>Você paga <b>R$ ${o.preco}</b> só quando receber.</div>
    ${st.wa?`<a class="btn go" href="${st.wa}" target="_blank" rel="noopener">ENVIAR MEU PEDIDO NO WHATSAPP</a>`:""}
    <p class="hint" style="margin-top:14px">No dia da entrega, avisamos pelo WhatsApp quando o entregador sair. Deixe alguém em casa para receber.</p></div>`);
  document.getElementById("bar").style.width="100%";
}

  fbq('init',CONFIG.pixelId); fbq('track','PageView');
}
render();
</script>
